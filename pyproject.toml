[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kersta"
version = "0.1.0"
description = "Kersta: a Bittensor subnet that tells real images, video and voices from AI made ones."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "httpx>=0.27",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
# The chain extra is needed by anyone who reads or writes the chain: miners
# submitting, validators setting weights, the owner committing test sets.
chain = ["bittensor>=11,<12"]
# Needed to train or run the starter detectors, and inside the sandbox image.
torch = ["torch>=2.3"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
kersta = "kersta.cli.main:main"

[tool.setuptools.packages.find]
include = ["kersta*"]

[tool.setuptools.package-data]
kersta = [
    "starter/*/*.py",
    "starter/*/*.md",
    "starter/*/package/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
